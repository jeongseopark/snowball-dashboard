<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SNOWBALL BOT CONTROL</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080C14; --bg2: #0D1520; --surface: #162035; --border: #1E2F4A;
  --cyan: #00E5FF; --green: #00E676; --red: #FF3D71; --gold: #FFD740;
  --text: #E8F0FF; --text2: #8FA8CC; --mono: 'Space Mono', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family: 'DM Sans', sans-serif; overflow:hidden;}

.app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto;background:var(--bg);}
#loader{position:absolute;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;}
.top-bar{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.bot-logo{font-family:'Syne';font-weight:800;font-size:18px;letter-spacing:1px;color:var(--cyan);}

.scroll-area{flex:1;overflow-y:auto;padding-bottom:100px;}
.section{padding:16px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px;}

/* VR 밴드 시각화 */
.band-meter { position: relative; height: 32px; background: var(--bg2); border-radius: 8px; margin: 15px 0; border: 1px solid var(--border); overflow: hidden; }
.band-range { position: absolute; height: 100%; background: rgba(0, 229, 255, 0.1); border-left: 2px solid var(--cyan); border-right: 2px solid var(--red); }
.price-marker { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--gold); box-shadow: 0 0 10px var(--gold); z-index: 2; transition: left 1s ease; }

.kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.kpi-box { background: var(--bg2); padding: 12px; border-radius: 10px; text-align: center; }
.kpi-val { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--cyan); }
.kpi-lab { font-size: 10px; color: var(--text2); margin-top: 4px; }

.bottom-nav{position:fixed;bottom:0;width:100%;max-width:430px;background:rgba(8,12,20,0.95);display:flex;padding:10px;border-top:1px solid var(--border);}
.nav-btn{flex:1;border:none;background:none;color:var(--text2);font-size:10px;cursor:pointer;}
.nav-btn.active{color:var(--cyan);}
.tab-content{display:none;} .tab-content.active{display:block;}

.log-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.log-ticker { font-family: var(--mono); font-weight: 700; }
.log-side.buy { color: var(--cyan); } .log-side.sell { color: var(--red); }
</style>
</head>
<body>
<div class="app">
  <div id="loader"><div style="color:var(--cyan);font-family:var(--mono);">LOADING...</div></div>
  <div class="top-bar">
    <div class="bot-logo">SNOWBALL CONTROL</div>
    <div style="font-family:var(--mono);font-size:10px;color:var(--text2);" id="sys-clock">--:--:--</div>
  </div>

  <div class="scroll-area">
    <!-- 무한매수 대시보드 -->
    <div class="tab-content active" id="tab-inf">
      <div class="section">
        <div class="card" style="border-left:4px solid var(--green)">
          <div style="font-size:11px;color:var(--text2);margin-bottom:8px;">TOTAL REALIZED PROFIT</div>
          <div style="font-family:var(--mono);font-size:32px;font-weight:700;color:var(--green);" id="inf-total-pnl">$0.00</div>
        </div>
        <div class="kpi-row">
          <div class="kpi-box"><div class="kpi-val" id="inf-cycle">#0</div><div class="kpi-lab">현재 주기</div></div>
          <div class="kpi-box"><div class="kpi-val" id="inf-install">0/40</div><div class="kpi-lab">진행 회차</div></div>
        </div>
        <div class="card" style="margin-top:12px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
            <span id="inf-ticker" style="font-family:var(--mono);font-weight:700;">TICKER</span>
            <span id="inf-pnl-rate" class="kpi-val">0.00%</span>
          </div>
          <div style="font-size:12px;color:var(--text2);">평단: <span id="inf-avg" style="color:var(--text)">$0.00</span> / 현재: <span id="inf-now" style="color:var(--text)">$0.00</span></div>
        </div>
      </div>
    </div>

    <!-- VR 대시보드 -->
    <div class="tab-content" id="tab-vr">
      <div class="section">
        <div class="card">
          <div style="font-size:11px;color:var(--text2);margin-bottom:8px;">VR ASSET VALUE</div>
          <div style="font-family:var(--mono);font-size:28px;font-weight:700;color:var(--cyan);" id="vr-total">0원</div>
        </div>
        <div class="card">
          <div style="font-size:11px;color:var(--text2);">BAND MONITORING</div>
          <div class="band-meter">
            <div class="band-range" id="vr-band-range"></div>
            <div class="price-marker" id="vr-marker"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text2);">
            <span>LOW: <b id="vr-low">0</b></span>
            <span>BASE(V): <b id="vr-v">0</b></span>
            <span>HIGH: <b id="vr-high">0</b></span>
          </div>
        </div>
        <div class="kpi-row">
          <div class="kpi-box"><div class="kpi-val" id="vr-pool">0원</div><div class="kpi-lab">보유 현금(Pool)</div></div>
          <div class="kpi-box"><div class="kpi-val" id="vr-status">HOLD</div><div class="kpi-lab">현재 상태</div></div>
        </div>
      </div>
    </div>

    <!-- 통합 거래 기록 -->
    <div class="tab-content" id="tab-logs">
      <div class="section">
        <div class="section-title">최근 매매 기록</div>
        <div id="combined-logs"></div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('inf',this)">♾️ 무매</button>
    <button class="nav-btn" onclick="switchTab('vr',this)">⚖️ VR</button>
    <button class="nav-btn" onclick="switchTab('logs',this)">📋 기록</button>
  </div>
</div>

<script>
const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQ88bOfnM9TYA8gFC4I5kpmbLCuaIJAPQbEAyYT9CFblRhhlYvy1dQ1GaehSHn7Z_LLbM1o3oJEwIYuwSbOwZs4myyRbuGp6OquU417EOEBfc-8Zt70seNXY21wqBLBPU0arBrzHq8KbqfBjGMuHohswBdE71T1HmrsRAqml-6WIipUzjut02RCDmnutdnwHWgqYihVT-pJ_G4C5Cpz73-DZdRbVSPCCAdTrG9lg8tSZUBjf2TyYDjWFEgChs3FtK07IqGt0HnBw-Rpv8TyWvgxBGpHDQ&lib=MOaNMMkVAUPU6oObcFycm5nxfxYy5yGjm"; // Apps Script 배포 후 URL 입력

function updateTime() {
  document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString('ko-KR', {hour12:false});
}
setInterval(updateTime, 1000);

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if(data.success) {
      // ── 무매 데이터 매핑 ──
      const inf = data.infinite;
      document.getElementById('inf-total-pnl').innerText = `$${parseFloat(inf.status[4]).toFixed(2)}`;
      document.getElementById('inf-cycle').innerText = `#${inf.trend[2]}`;
      document.getElementById('inf-install').innerText = `${inf.trend[3]} / 40`;
      document.getElementById('inf-ticker').innerText = inf.trend[1];
      document.getElementById('inf-avg').innerText = `$${parseFloat(inf.trend[5]).toFixed(2)}`;
      document.getElementById('inf-now').innerText = `$${parseFloat(inf.trend[4]).toFixed(2)}`;
      
      const pnl = ((inf.trend[4] - inf.trend[5]) / inf.trend[5] * 100).toFixed(2);
      document.getElementById('inf-pnl-rate').innerText = `${pnl}%`;
      document.getElementById('inf-pnl-rate').style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';

      // ── VR 데이터 매핑 ──
      const vr = data.vr;
      document.getElementById('vr-total').innerText = `${vr.curr_value.toLocaleString()}원`;
      document.getElementById('vr-pool').innerText = `${vr.pool.toLocaleString()}원`;
      document.getElementById('vr-v').innerText = vr.v_value.toLocaleString();
      document.getElementById('vr-low').innerText = vr.lower.toLocaleString();
      document.getElementById('vr-high').innerText = vr.upper.toLocaleString();
      document.getElementById('vr-status').innerText = vr.status;

      const range = vr.upper - vr.lower;
      const pos = ((vr.curr_value - vr.lower) / range) * 100;
      document.getElementById('vr-marker').style.left = `${Math.min(Math.max(pos, 0), 100)}%`;

      // ── 로그 통합 ──
      const logContainer = document.getElementById('combined-logs');
      logContainer.innerHTML = inf.logs.slice(0, 15).map(l => `
        <div class="log-item">
          <div><span class="log-ticker">${l[1]}</span> <span style="color:var(--text2);margin-left:5px;">${l[0].toString().substring(5,10)}</span></div>
          <div class="log-side ${l[5].includes('매수')?'buy':'sell'}">${l[5]} ${l[7]}주</div>
        </div>
      `).join('');
    }
  } catch(e) { console.error(e); }
  finally { document.getElementById('loader').style.display = 'none'; }
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

loadData();
</script>
</body>
</html>
