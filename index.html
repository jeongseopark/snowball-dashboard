<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIP SNOWBALL & VR BOT</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #080C14; --bg2: #0D1520; --surface: #162035; --surface2: #1C2940;
  --border: #1E2F4A; --cyan: #00E5FF; --green: #00E676; --red: #FF3D71;
  --gold: #FFD740; --purple: #7C4DFF; --text: #E8F0FF; --text2: #8FA8CC;
  --mono: 'Space Mono', monospace; --head: 'Syne', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans', sans-serif;overflow-x:hidden;}

.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.top-bar{padding:20px;display:flex;justify-content:space-between;align-items:center;}
.bot-info{display:flex;align-items:center;gap:12px;}
.bot-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:20px;}
.bot-name{font-family:var(--head);font-weight:800;font-size:18px;}

/* 플로팅 네비게이션 */
.nav-wrap{padding:10px 16px;position:sticky;top:0;z-index:100;background:rgba(8,12,20,0.9);backdrop-filter:blur(10px);}
.nav{display:flex;background:var(--surface2);padding:4px;border-radius:30px;border:1px solid var(--border);}
.nav-btn{flex:1;padding:12px 0;border:none;background:none;color:var(--text2);font-family:var(--head);font-weight:700;font-size:12px;border-radius:26px;cursor:pointer;}
.nav-btn.active{background:var(--cyan);color:#000;}

.content{padding:16px;flex:1;}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* 메인 카드 스타일 (이미지 기반) */
.hero-card{background:linear-gradient(135deg, #1A1423 0%, #2D1B4E 100%);border:1.5px solid var(--purple);border-radius:24px;padding:24px;margin-bottom:20px;position:relative;}
.hero-label{font-size:12px;color:var(--text2);font-family:var(--mono);text-transform:uppercase;margin-bottom:8px;letter-spacing:1px;}
.hero-value{font-family:var(--mono);font-size:42px;font-weight:700;color:#fff;margin-bottom:20px;}
.divider{height:1px;background:rgba(255,255,255,0.1);margin:20px 0;}

.detail-row{display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px;}
.detail-key{color:var(--text2);}
.detail-val{font-family:var(--mono);font-weight:700;}

/* KPI 그리드 */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;}
.kpi-label{font-size:10px;color:var(--text2);margin-bottom:4px;}
.kpi-value{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--cyan);}

.section-title{font-family:var(--head);font-size:12px;color:var(--text2);margin:24px 0 12px;display:flex;align-items:center;gap:10px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}
</style>
</head>
<body>

<div class="app">
  <div class="top-bar">
    <div class="bot-info">
      <div class="bot-avatar">🤖</div>
      <div class="bot-name">VIP 관제탑</div>
    </div>
    <div style="text-align:right; font-family:var(--mono); font-size:10px; color:var(--text2);">
      NY <span id="clock-ny">00:00:00</span><br>
      KR <span id="clock-kr">00:00:00</span>
    </div>
  </div>

  <div class="nav-wrap">
    <div class="nav">
      <button class="nav-btn active" onclick="switchTab('infinite', this)">🇺🇸 무한매수</button>
      <button class="nav-btn" onclick="switchTab('total', this)">🌐 TOTAL</button>
      <button class="nav-btn" onclick="switchTab('vr', this)">🇰🇷 VR 봇</button>
    </div>
  </div>

  <div class="content">
    <!-- 무한매수 탭 -->
    <div id="tab-infinite" class="tab-content active">
      <div class="hero-card" style="background:var(--bg2); border-color:var(--border);">
        <div class="hero-label">TQQQ REALIZED PNL</div>
        <div class="hero-value" id="ui-realized-pnl" style="color:var(--green);">+$0.00</div>
        <div class="kpi-grid" style="margin-bottom:0;">
          <div class="kpi-card"><div class="kpi-label">진행 사이클</div><div class="kpi-value" id="ui-cycle-num">#0</div></div>
          <div class="kpi-card"><div class="kpi-label">진행 회차</div><div class="kpi-value" id="ui-current-step" style="color:var(--gold);">0 / 40</div></div>
        </div>
      </div>
    </div>

    <!-- TOTAL 탭 (image_05af52.jpg 스타일 적용) -->
    <div id="tab-total" class="tab-content">
      <div class="hero-card">
        <div style="display:flex; justify-content:space-between;">
          <div class="hero-label">TOTAL PORTFOLIO</div>
          <div style="background:rgba(255,255,255,0.1); padding:4px 8px; border-radius:8px; font-size:10px;">🇺🇸 USD 보기</div>
        </div>
        <div style="font-size:12px; color:var(--text2); margin-top:16px;">현재 계좌 총 금액 (시드 합산)</div>
        <div class="hero-value" id="ui-total-balance">₩0</div>
        
        <div class="divider"></div>
        
        <div class="detail-row">
          <span class="detail-key">현재 매수 금액 (투입금)</span>
          <span class="detail-val" id="ui-total-invested">₩0</span>
        </div>
        <div class="detail-row">
          <span class="detail-key">누적 실현 수익</span>
          <span class="detail-val" id="ui-total-realized" style="color:var(--green);">+₩0</span>
        </div>
        <div class="detail-row">
          <span class="detail-key">현재 평가 수익</span>
          <span class="detail-val" id="ui-total-pnl" style="color:var(--green);">+₩0 (0.00%)</span>
        </div>
      </div>
    </div>

    <!-- VR 봇 탭 -->
    <div id="tab-vr" class="tab-content">
      <div class="section-title">🇰🇷 VR 봇 가동 현황</div>
      <div class="kpi-card" style="width:100%; margin-bottom:12px;">
        <div class="kpi-label">사장님 계좌</div>
        <div class="kpi-value">₩1,000,000</div>
      </div>
      <div class="kpi-card" style="width:100%;">
        <div class="kpi-label">혜진님 계좌</div>
        <div class="kpi-value">₩1,000,000</div>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxI6cIbRpL5-r8xnGLvtbTkCNxAolrFr7maCV6hr0D8tdUCK5wpyaSU6fa6m1wDZqSTvw/exec";

function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

function updateClocks() {
  const now = new Date();
  const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
  document.getElementById('clock-ny').innerText = new Intl.DateTimeFormat('en-US', { ...options, timeZone: 'America/New_York' }).format(now);
  document.getElementById('clock-kr').innerText = new Intl.DateTimeFormat('ko-KR', { ...options, timeZone: 'Asia/Seoul' }).format(now);
}
setInterval(updateClocks, 1000);

async function fetchData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    
    // 데이터 추출 및 UI 업데이트 로직 (안정 버전)
    if(data.status && data.status.length > 1) {
      const cur = data.status[data.status.length-1];
      document.getElementById('ui-cycle-num').innerText = `#${cur[0]}`;
      // 필요 시 추가 데이터 매핑
    }
    
    // TOTAL 탭 임시 수치 (추후 API 연동)
    document.getElementById('ui-total-balance').innerText = "₩2,283,602";
    document.getElementById('ui-total-invested').innerText = "₩2,110,454";
    document.getElementById('ui-total-realized').innerText = "+₩94,500";
    document.getElementById('ui-total-pnl').innerText = "+₩173,148 (8.20%)";

  } catch(e) { console.error("Data fetch error", e); }
}
fetchData();
</script>
</body>
</html>
