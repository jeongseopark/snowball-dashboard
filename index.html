<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SNOWBALL BOT CONTROL</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&family=Syne:wght@800&family=DM+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080C14; --surface: #162035; --border: #1E2F4A;
  --cyan: #00E5FF; --green: #00E676; --red: #FF3D71; --gold: #FFD740;
  --text: #E8F0FF; --text2: #8FA8CC;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family: 'DM Sans', sans-serif; overflow:hidden;}

/* ── 상단 플로팅 네비게이션 ── */
.nav-wrapper {
  position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
  width: 90%; max-width: 400px; z-index: 1000;
}
.floating-nav {
  background: rgba(22, 32, 53, 0.85); backdrop-filter: blur(15px);
  border: 1px solid var(--border); border-radius: 25px;
  display: flex; padding: 5px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.nav-btn {
  flex: 1; border: none; background: none; color: var(--text2);
  padding: 12px 0; font-size: 14px; font-weight: 700; cursor: pointer;
  border-radius: 20px; transition: 0.3s;
}
.nav-btn.active { background: var(--cyan); color: #000; }

.scroll-area { height: 100vh; overflow-y: auto; padding-top: 90px; padding-bottom: 50px; }
.section { padding: 20px; }

/* ── 큼직한 카드 UI ── */
.card { background: var(--surface); border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--border); }
.label { font-size: 14px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.value-lg { font-family: 'Space Mono'; font-size: 42px; font-weight: 800; color: var(--green); line-height: 1.1; }
.value-md { font-family: 'Space Mono'; font-size: 28px; font-weight: 700; color: var(--cyan); }

/* ── VR 밴드 미터 ── */
.band-meter { position: relative; height: 40px; background: #0D1520; border-radius: 10px; margin: 20px 0; border: 1px solid var(--border); }
.band-range { position: absolute; height: 100%; background: rgba(0, 229, 255, 0.1); border-left: 3px solid var(--cyan); border-right: 3px solid var(--red); }
.price-marker { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--gold); box-shadow: 0 0 15px var(--gold); z-index: 2; transition: left 1s; }

.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.kpi-box { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 18px; text-align: center; }

#loader { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono'; color: var(--cyan); }

.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeInUp 0.4s ease-out; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="loader">INITIALIZING...</div>

<div class="nav-wrapper">
  <div class="floating-nav">
    <button class="nav-btn active" onclick="switchTab('inf', this)">무한매수</button>
    <button class="nav-btn" onclick="switchTab('vr', this)">VR 관제</button>
    <button class="nav-btn" onclick="switchTab('logs', this)">매매기록</button>
  </div>
</div>

<div class="scroll-area">
  <!-- 무매 탭 -->
  <div class="tab-content active" id="tab-inf">
    <div class="section">
      <div class="card">
        <div class="label">Total Realized PnL</div>
        <div class="value-lg" id="inf-total-pnl">$0.00</div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-box"><div class="label">Cycle</div><div class="value-md" id="inf-cycle">#0</div></div>
        <div class="kpi-box"><div class="label">Install</div><div class="value-md" id="inf-install">0/40</div></div>
      </div>
      <div class="card" style="margin-top:20px;">
        <div class="label">Current Position</div>
        <div style="display:flex; justify-content:space-between; align-items:flex-end;">
          <div id="inf-ticker" style="font-size:24px; font-weight:800; color:var(--cyan);">TICKER</div>
          <div id="inf-pnl-rate" style="font-size:24px; font-weight:800;">0.00%</div>
        </div>
        <div style="margin-top:15px; font-size:16px; color:var(--text2); font-family:'Space Mono';">
          AVG: <span id="inf-avg" style="color:var(--text)">$0.00</span> / NOW: <span id="inf-now" style="color:var(--text)">$0.00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- VR 탭 -->
  <div class="tab-content" id="tab-vr">
    <div class="section">
      <div class="card">
        <div class="label">Asset Value</div>
        <div class="value-lg" id="vr-total" style="color:var(--cyan);">0원</div>
      </div>
      <div class="card">
        <div class="label">VR Band Monitoring</div>
        <div class="band-meter">
          <div class="band-range" id="vr-band-range"></div>
          <div class="price-marker" id="vr-marker"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-family:'Space Mono'; font-size:12px; color:var(--text2);">
          <span>LOW: <b id="vr-low">0</b></span>
          <span style="color:var(--cyan)">V: <b id="vr-v">0</b></span>
          <span>HIGH: <b id="vr-high">0</b></span>
        </div>
      </div>
      <div class="kpi-grid">
        <div class="kpi-box"><div class="label">Cash (Pool)</div><div class="value-md" id="vr-pool">0원</div></div>
        <div class="kpi-box"><div class="label">Status</div><div class="value-md" id="vr-status">HOLD</div></div>
      </div>
    </div>
  </div>

  <!-- 기록 탭 -->
  <div class="tab-content" id="tab-logs">
    <div class="section" id="log-list">
      <!-- 로그 항목 생성 -->
    </div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxI6cIbRpL5-r8xnGLvtbTkCNxAolrFr7maCV6hr0D8tdUCK5wpyaSU6fa6m1wDZqSTvw/exec"; 

async function fetchData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if(data.success) {
      // ── 무매 데이터 (인덱스 보강) ──
      const inf = data.infinite;
      document.getElementById('inf-total-pnl').innerText = `$${parseFloat(inf.status[4] || 0).toFixed(2)}`;
      document.getElementById('inf-cycle').innerText = `#${inf.trend[2] || 0}`;
      document.getElementById('inf-install').innerText = `${inf.trend[3] || 0}/40`;
      document.getElementById('inf-ticker').innerText = inf.trend[1] || "WAIT";
      document.getElementById('inf-avg').innerText = `$${parseFloat(inf.trend[5] || 0).toFixed(2)}`;
      document.getElementById('inf-now').innerText = `$${parseFloat(inf.trend[4] || 0).toFixed(2)}`;
      
      const pnl = inf.trend[5] > 0 ? ((inf.trend[4] - inf.trend[5]) / inf.trend[5] * 100).toFixed(2) : 0;
      const pnlEl = document.getElementById('inf-pnl-rate');
      pnlEl.innerText = `${pnl}%`;
      pnlEl.style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';

      // ── VR 데이터 ──
      const vr = data.vr;
      document.getElementById('vr-total').innerText = `${Math.round(vr.curr_value).toLocaleString()}원`;
      document.getElementById('vr-pool').innerText = `${Math.round(vr.pool).toLocaleString()}원`;
      document.getElementById('vr-v').innerText = Math.round(vr.v_value).toLocaleString();
      document.getElementById('vr-low').innerText = Math.round(vr.lower).toLocaleString();
      document.getElementById('vr-high').innerText = Math.round(vr.upper).toLocaleString();
      document.getElementById('vr-status').innerText = vr.status;

      const range = vr.upper - vr.lower;
      const pos = range > 0 ? ((vr.curr_value - vr.lower) / range) * 100 : 50;
      document.getElementById('vr-marker').style.left = `${Math.min(Math.max(pos, 0), 100)}%`;
    }
  } catch(e) { console.error("Error:", e); }
  finally { document.getElementById('loader').style.display = 'none'; }
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + id).classList.add('active');
  btn.classList.add('active');
}

fetchData();
setInterval(fetchData, 60000); // 1분마다 갱신
</script>
</body>
</html>
